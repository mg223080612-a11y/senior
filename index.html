<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goodbye Senior</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&text=%ED%8E%B8%EC%A7%80%EC%A7%80%EB%A5%BC%ED%81%B4%EB%A6%AD%ED%95%98%EC%8B%9C%EC%98%A4&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1페이지: ㅅㄴㅇ 로고 + 구글 로그인 -->
  <section id="intro" class="page active">
    <div class="card frame">
    <h1 class="logo" aria-label="ㅅㄴㅇ">
      <svg class="letter" viewBox="0 0 100 80" aria-hidden="true">
        <path d="M0 80 L50 0 L100 80 H89.4 L50 17 L10.6 80 Z"/>
      </svg>
      <svg class="letter" viewBox="0 0 70 80" aria-hidden="true">
        <path d="M0 0 H9 V71 H70 V80 H0 Z"/>
      </svg>
      <svg class="letter" viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="40" cy="40" r="35.5" fill="none" stroke-width="9"/>
      </svg>
    </h1>
    </div>

    <div class="login">
      <button id="google-login" class="google-btn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Google 계정으로 로그인</span>
      </button>
      <p id="login-error" class="login-error" role="alert"></p>
    </div>
  </section>

  <!-- 로그인 후: 둥둥 떠다니는 편지 -->
  <section id="letter" class="page" aria-hidden="true">
    <button id="envelope" class="envelope" type="button" aria-label="편지 열기">
      <span class="env-back"></span>
      <span class="env-paper frame"></span>
      <svg class="env-front" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M1 1 L150 112 L299 1 V199 H1 Z" />
        <path class="env-line" d="M1 199 L124 92 M299 199 L176 92" />
      </svg>
      <svg class="env-flap" viewBox="0 0 300 116" preserveAspectRatio="none" aria-hidden="true">
        <path d="M1 1 H299 L150 115 Z" />
      </svg>
      <img class="env-seal" src="assets/icons/icon-192.png" alt="">
    </button>
    <p class="hint">편지지를 클릭하시오</p>
  </section>

  <!-- 2페이지: 시니어를 졸업시키시겠습니까? -->
  <section id="question" class="page" aria-hidden="true">
    <div class="q-card frame">
      <img class="ornament" src="assets/ornament.svg" alt="">
      <img class="title" src="assets/title.svg" alt="시니어를 졸업시키시겠습니까?">
      <img class="ornament" src="assets/ornament.svg" alt="">
      <div class="choices">
        <button id="yes" class="win-btn" type="button">Yes</button>
        <button id="no" class="win-btn" type="button">No</button>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <img src="assets/footer-logo.png" alt="GVCS 문경 글로벌선진학교">
    <p>© GVCS Class of 2027<br>Designed by Soorin Lee · Developed by Dahee Jung</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
